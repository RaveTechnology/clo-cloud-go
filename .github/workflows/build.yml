name: Checks and release
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CLO_CSI_SANITY_LAB: ''
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.1
        cache: true
    - run: |-
        python3 -m venv .venv
        .venv/bin/pip install -r scripts/requirements-test.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      name: Pinned Python test tools
    - run: make check
      name: Existing race and vet checks
    - run: |-
        case "$GITHUB_REF" in
          refs/tags/v*) version="$GITHUB_REF_NAME" ;;
          *) version="v$(cat VERSION)" ;;
        esac
        version="${version#v}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
      id: version
      name: Resolve release version
  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: |-
        test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
        gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      env:
        GH_TOKEN: ${{ github.token }}
